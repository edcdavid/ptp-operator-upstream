name: "linuxptp-daemon: golangci-lint"

on:
  push:
    branches:
      - main
    paths:
      - 'linuxptp-daemon/**'
  pull_request:
    branches:
      - main
    paths:
      - 'linuxptp-daemon/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Run GolangCI-Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linuxptp-daemon

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.24 # Change this to match your Go version

      - name: lint test
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
          working-directory: linuxptp-daemon
